<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Jom Belajar</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #6C63FF; --green: #2ECC71; --orange: #FF8C42;
      --red: #FF4D6D; --yellow: #FFD60A;
      --bg: #F7F9FF; --card: #fff; --text: #1A1A2E; --muted: #7B7B9A;
      --radius: 14px; --shadow: 0 4px 20px rgba(108,99,255,0.1);
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 24px;
    }
    #login-screen h1 { font-size: 26px; font-weight: 800; color: var(--purple); margin-bottom: 6px; }
    #login-screen p  { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .login-box {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 32px 28px; width: 100%; max-width: 360px;
    }
    .login-box label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .login-box input {
      width: 100%; padding: 13px 16px; border: 2px solid #E0E0F0;
      border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 15px;
      outline: none; margin-bottom: 16px;
    }
    .login-box input:focus { border-color: var(--purple); }
    .btn {
      width: 100%; padding: 14px; background: var(--purple); color: white;
      border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn:hover { opacity: .9; }
    .err { color: var(--red); font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }

    .dash-header {
      display: flex; align-items: center; gap: 14px;
      background: var(--purple); border-radius: var(--radius);
      padding: 20px 24px; color: white; margin-bottom: 24px;
    }
    .dash-header img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid white; }
    .dash-header h1  { font-size: 20px; font-weight: 800; }
    .dash-header p   { font-size: 13px; opacity: .85; }
    .dash-header .logout {
      margin-left: auto; background: rgba(255,255,255,.2); border: none;
      color: white; font-family: 'Nunito', sans-serif; font-size: 13px;
      font-weight: 700; padding: 8px 16px; border-radius: 50px; cursor: pointer;
    }

    /* ── Stat cards ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 18px 16px; text-align: center;
    }
    .stat-card .val { font-size: 30px; font-weight: 800; color: var(--purple); }
    .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── Subject breakdown ── */
    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
    .subj-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .subj-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px;
    }
    .subj-card h3 { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
    .bar-track { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
    .bar-fill  { height: 100%; border-radius: 5px; transition: width .6s; }
    .subj-card p { font-size: 12px; color: var(--muted); }

    /* ── Filters ── */
    .filter-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px;
    }
    .filter-row select, .filter-row input {
      padding: 9px 14px; border: 2px solid #E0E0F0; border-radius: 50px;
      font-family: 'Nunito', sans-serif; font-size: 13px; outline: none;
    }
    .filter-row select:focus, .filter-row input:focus { border-color: var(--purple); }
    .btn-export {
      margin-left: auto; padding: 9px 18px; background: var(--green);
      color: white; border: none; border-radius: 50px;
      font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    }

    /* ── Table ── */
    .table-wrap { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #F0EEFF; color: var(--purple); font-weight: 800; padding: 13px 16px; text-align: left; cursor: pointer; white-space: nowrap; }
    th:hover { background: #E4E0FF; }
    td { padding: 12px 16px; border-bottom: 1px solid #F0F0F8; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFAFE; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 50px;
      font-size: 11px; font-weight: 700;
    }
    .badge-bm       { background: #EDE9FF; color: var(--purple); }
    .badge-matematik{ background: #FFF3E8; color: var(--orange); }
    .badge-sains    { background: #E8FFF3; color: var(--green);  }

    .stars { color: #FFD60A; letter-spacing: 2px; }

    .empty { text-align: center; padding: 48px; color: var(--muted); }
    .empty div { font-size: 48px; margin-bottom: 10px; }

    .loading { text-align: center; padding: 48px; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <h1>🔐 Admin Panel</h1>
  <p>Jom Belajar — Rekod Aalaa'</p>
  <div class="login-box">
    <label>Kata laluan admin:</label>
    <input type="password" id="inp-pw" placeholder="Masukkan kata laluan" />
    <button class="btn" id="btn-login">Log Masuk</button>
    <p class="err" id="login-err">❌ Kata laluan salah. Cuba lagi.</p>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="dash-header">
    <img src="public/aalaa.jpg" alt="Aalaa'" />
    <div>
      <h1>Rekod Aalaa'</h1>
      <p id="dash-date">Memuatkan...</p>
    </div>
    <button class="logout" id="btn-logout">Log Keluar</button>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="val" id="st-total">—</div><div class="lbl">Jumlah Latihan</div></div>
    <div class="stat-card"><div class="val" id="st-stars">—</div><div class="lbl">⭐ Bintang</div></div>
    <div class="stat-card"><div class="val" id="st-avg">—</div><div class="lbl">Purata %</div></div>
    <div class="stat-card"><div class="val" id="st-perfect">—</div><div class="lbl">100% Sempurna</div></div>
  </div>

  <p class="section-title">Prestasi Mengikut Subjek</p>
  <div class="subj-row" id="subj-row"></div>

  <p class="section-title">Semua Rekod</p>
  <div class="filter-row">
    <select id="flt-subject">
      <option value="">Semua Subjek</option>
      <option value="bm">Bahasa Malaysia</option>
      <option value="matematik">Matematik</option>
      <option value="sains">Sains</option>
    </select>
    <select id="flt-grade">
      <option value="">Semua Peringkat</option>
      <option value="tahun6">6 Tahun</option>
      <option value="darjah1">Darjah 1</option>
    </select>
    <input type="text" id="flt-search" placeholder="Cari topik..." />
    <button class="btn-export" id="btn-export">⬇ Export CSV</button>
  </div>

  <div class="table-wrap">
    <table id="records-table">
      <thead>
        <tr>
          <th data-col="timestamp">Tarikh & Masa ↕</th>
          <th data-col="subject">Subjek</th>
          <th data-col="grade">Peringkat</th>
          <th data-col="topicTitle">Topik</th>
          <th data-col="correct">Betul/Jumlah</th>
          <th data-col="percentage">%</th>
          <th data-col="stars">Bintang</th>
        </tr>
      </thead>
      <tbody id="records-body">
        <tr><td colspan="7" class="loading">⏳ Memuatkan rekod...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const ADMIN_PASSWORD = "AalaaAbah2024";

const firebaseConfig = {
  apiKey:        "AIzaSyC6TbStfWv2lE3qvQxf8WMsUJNlhVMpc_Q",
  authDomain:    "brain-refresh-db364.firebaseapp.com",
  projectId:     "brain-refresh-db364",
  storageBucket: "brain-refresh-db364.appspot.com",
};
const app = initializeApp(firebaseConfig, "edukid-admin");
const db  = getFirestore(app);

const SUBJ_LABEL = { bm: "Bahasa Malaysia", matematik: "Matematik", sains: "Sains" };
const SUBJ_COLOR = { bm: "#6C63FF", matematik: "#FF8C42", sains: "#2ECC71" };
const GRADE_LABEL = { tahun6: "6 Tahun", darjah1: "Darjah 1" };

let allRecords = [];
let sortCol = "timestamp", sortAsc = false;

// ── Login ─────────────────────────────────────────────────────────
document.getElementById("btn-login").addEventListener("click", tryLogin);
document.getElementById("inp-pw").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });

function tryLogin() {
  const pw = document.getElementById("inp-pw").value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("dash-date").textContent = "Hari ini: " + new Date().toLocaleDateString("ms-MY", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
    loadRecords();
  } else {
    document.getElementById("login-err").style.display = "block";
  }
}

document.getElementById("btn-logout").addEventListener("click", () => {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("inp-pw").value = "";
});

// ── Load Firestore ────────────────────────────────────────────────
async function loadRecords() {
  const q    = query(collection(db, "edukid_progress"), orderBy("timestamp", "desc"));
  const snap = await getDocs(q);
  allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderStats();
  renderSubjects();
  renderTable();
}

// ── Stats ─────────────────────────────────────────────────────────
function renderStats() {
  const total   = allRecords.length;
  const stars   = allRecords.reduce((s, r) => s + (r.stars || 0), 0);
  const avg     = total ? Math.round(allRecords.reduce((s, r) => s + (r.percentage || 0), 0) / total) : 0;
  const perfect = allRecords.filter(r => r.percentage === 100).length;

  document.getElementById("st-total").textContent   = total;
  document.getElementById("st-stars").textContent   = "⭐ " + stars;
  document.getElementById("st-avg").textContent     = avg + "%";
  document.getElementById("st-perfect").textContent = perfect;
}

// ── Subject breakdown ─────────────────────────────────────────────
function renderSubjects() {
  const subjects = ["bm", "matematik", "sains"];
  const html = subjects.map(s => {
    const recs  = allRecords.filter(r => r.subject === s);
    const avg   = recs.length ? Math.round(recs.reduce((a, r) => a + (r.percentage || 0), 0) / recs.length) : 0;
    const color = SUBJ_COLOR[s];
    return `
      <div class="subj-card">
        <h3>${SUBJ_LABEL[s]}</h3>
        <div class="bar-track"><div class="bar-fill" style="width:${avg}%;background:${color}"></div></div>
        <p>Purata: <strong>${avg}%</strong> &nbsp;|&nbsp; ${recs.length} latihan</p>
      </div>`;
  }).join("");
  document.getElementById("subj-row").innerHTML = html;
}

// ── Table ─────────────────────────────────────────────────────────
function filtered() {
  const subj   = document.getElementById("flt-subject").value;
  const grade  = document.getElementById("flt-grade").value;
  const search = document.getElementById("flt-search").value.toLowerCase();
  return allRecords.filter(r =>
    (!subj   || r.subject === subj) &&
    (!grade  || r.grade   === grade) &&
    (!search || (r.topicTitle || "").toLowerCase().includes(search))
  );
}

function renderTable() {
  const rows = filtered().slice().sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === "timestamp") { av = av?.seconds || 0; bv = bv?.seconds || 0; }
    return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
  });

  if (!rows.length) {
    document.getElementById("records-body").innerHTML =
      `<tr><td colspan="7" class="empty"><div>📭</div>Tiada rekod lagi.</td></tr>`;
    return;
  }

  document.getElementById("records-body").innerHTML = rows.map(r => {
    const ts    = r.timestamp?.seconds ? new Date(r.timestamp.seconds * 1000).toLocaleString("ms-MY") : "—";
    const stars = "⭐".repeat(r.stars || 0) + "☆".repeat(3 - (r.stars || 0));
    const subj  = r.subject || "";
    return `
      <tr>
        <td>${ts}</td>
        <td><span class="badge badge-${subj}">${SUBJ_LABEL[subj] || subj}</span></td>
        <td>${GRADE_LABEL[r.grade] || r.grade || "—"}</td>
        <td>${r.topicTitle || r.topicId || "—"}</td>
        <td>${r.correct ?? "—"} / ${r.total ?? "—"}</td>
        <td><strong>${r.percentage ?? "—"}%</strong></td>
        <td class="stars">${stars}</td>
      </tr>`;
  }).join("");
}

// ── Sort ──────────────────────────────────────────────────────────
document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    if (sortCol === th.dataset.col) sortAsc = !sortAsc;
    else { sortCol = th.dataset.col; sortAsc = false; }
    renderTable();
  });
});

// ── Filters ───────────────────────────────────────────────────────
["flt-subject","flt-grade","flt-search"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderTable);
});

// ── Export CSV ────────────────────────────────────────────────────
document.getElementById("btn-export").addEventListener("click", () => {
  const rows = filtered();
  const header = ["Tarikh","Subjek","Peringkat","Topik","Betul","Jumlah","%","Bintang"];
  const lines  = rows.map(r => {
    const ts = r.timestamp?.seconds ? new Date(r.timestamp.seconds * 1000).toLocaleString("ms-MY") : "";
    return [ts, SUBJ_LABEL[r.subject]||r.subject, GRADE_LABEL[r.grade]||r.grade,
            r.topicTitle, r.correct, r.total, r.percentage, r.stars].join(",");
  });
  const blob = new Blob([[header, ...lines].join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rekod-aalaa.csv";
  a.click();
});
</script>
</body>
</html>
